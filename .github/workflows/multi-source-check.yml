name: Multi-source build check

on:
  push:
    branches:
      - restore-multi-source
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ChampR
        run: cargo check -p champr
