name: Dev compile probe

on:
  push:
    branches:
      - restore-multi-source

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        continue-on-error: true
        run: cargo check -p champr
