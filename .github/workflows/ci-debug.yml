name: CI Debug Compile

on:
  push:
    branches:
      - ci-debug

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (capture only)
        shell: pwsh
        run: |
          cargo check -p champr 2>&1 | Tee-Object cargo-check.log
          exit 0
      - name: Print captured compiler output
        shell: pwsh
        run: Get-Content cargo-check.log
